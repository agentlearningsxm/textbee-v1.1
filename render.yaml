services:
  # TextBee API Service
  - type: web
    name: textbee-api
    env: node
    region: oregon
    plan: free
    rootDir: api
    buildCommand: pnpm install --frozen-lockfile && pnpm run build
    startCommand: pnpm run start:prod
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PNPM_VERSION
        value: "9"

  # TextBee Web Service
  - type: web
    name: textbee-web
    env: node
    region: oregon
    plan: free
    rootDir: web
    buildCommand: pnpm install --frozen-lockfile && pnpm run build
    startCommand: pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PNPM_VERSION
        value: "9"
