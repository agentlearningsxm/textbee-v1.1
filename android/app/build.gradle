plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.vernu.sms'
    compileSdk 35

    buildFeatures {
        buildConfig true
        resValues true
        compose true
    }

    defaultConfig {
        minSdk 24
        targetSdk 35
        versionCode 21
        versionName "2.9.0"
        buildConfigField "String", "REQUIRED_SMS_CARRIER", '""'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

//        javaCompileOptions {
//            annotationProcessorOptions {
//                arguments["room.schemaLocation"] = "$projectDir/schemas"
//            }
//        }
    }
    def debugKeystoreHome = System.getenv("HOME") ?: System.getProperty("user.home")
    // Supplied locally; never commit signing material. An existing certificate
    // may have a Debug subject while still being the owner's upgrade identity.
    def ownerReleaseStore = project.findProperty('textbeeReleaseStoreFile') ?: System.getenv('TEXTBEE_RELEASE_STORE_FILE')
    def ownerReleaseStorePassword = project.findProperty('textbeeReleaseStorePassword') ?: System.getenv('TEXTBEE_RELEASE_STORE_PASSWORD')
    def ownerReleaseAlias = project.findProperty('textbeeReleaseKeyAlias') ?: System.getenv('TEXTBEE_RELEASE_KEY_ALIAS')
    def ownerReleaseKeyPassword = project.findProperty('textbeeReleaseKeyPassword') ?: System.getenv('TEXTBEE_RELEASE_KEY_PASSWORD')
    def hasOwnerReleaseSigning = [ownerReleaseStore, ownerReleaseStorePassword, ownerReleaseAlias, ownerReleaseKeyPassword].every { it }
    signingConfigs {
        if (hasOwnerReleaseSigning) {
            ownerRelease {
                storeFile file(ownerReleaseStore)
                storePassword ownerReleaseStorePassword
                keyAlias ownerReleaseAlias
                keyPassword ownerReleaseKeyPassword
            }
        }
        debug {
            storeFile file("${debugKeystoreHome}/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Release identity is explicit and independent of debug settings.
            // Without it Gradle produces a clearly named unsigned candidate.
            if (hasOwnerReleaseSigning) signingConfig signingConfigs.ownerRelease
        }
        debug {
            minifyEnabled false
            debuggable true
            signingConfig signingConfigs.debug
        }
    }

    flavorDimensions "environment"
    
    productFlavors {
        dev {
            dimension "environment"
            applicationId "com.vernu.sms.dev"
            versionNameSuffix "-dev"
            buildConfigField "String", "API_BASE_URL", '"https://api.dev.textbee.dev/api/v1/"'
            buildConfigField "String", "WEB_BASE_URL", '"https://dev.textbee.dev"'
            buildConfigField "String", "ENVIRONMENT", '"development"'
            resValue "string", "app_name", "textbee.dev (Dev)"
        }
        
        prod {
            dimension "environment"
            applicationId "com.vernu.sms"
            buildConfigField "String", "API_BASE_URL", '"https://api.textbee.dev/api/v1/"'
            buildConfigField "String", "WEB_BASE_URL", '"https://textbee.dev"'
            buildConfigField "String", "ENVIRONMENT", '"production"'
            resValue "string", "app_name", "textbee.dev"
        }

        selfhosted {
            dimension "environment"
            applicationId "com.vernu.sms.selfhosted"
            versionName "2.9.0-selfhosted"
            versionCode 27
            buildConfigField "String", "REQUIRED_SMS_CARRIER", '"hollandsnieuwe"'
            buildConfigField "String", "API_BASE_URL", '"https://textbee.reynubixvoice.cloud/api/v1/"'
            buildConfigField "String", "WEB_BASE_URL", '"https://textbee-cloud.vercel.app"'
            buildConfigField "String", "ENVIRONMENT", '"production"'
            resValue "string", "app_name", "TextBee SelfHosted"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.4.8'
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.3.0'
    implementation 'com.google.android.material:material:1.8.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'

    implementation platform('com.google.firebase:firebase-bom:29.2.1')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-messaging-directboot'
    implementation 'com.google.firebase:firebase-crashlytics'

    implementation 'com.google.code.gson:gson:2.9.0'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    // Declared rather than taken transitively from Retrofit: the app builds its
    // own client to name itself in outgoing requests.
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    
    implementation 'androidx.work:work-runtime:2.7.1'
    implementation 'androidx.concurrent:concurrent-futures:1.1.0'

    // Jetpack Compose
    implementation platform('androidx.compose:compose-bom:2023.08.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material:material-icons-extended'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // Compose integration
    implementation 'androidx.activity:activity-compose:1.7.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.6.1'
    implementation 'androidx.navigation:navigation-compose:2.7.2'

    // Coroutines + Lifecycle
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.1'

//    def room_version = "2.4.2"
//    implementation "androidx.room:room-runtime:$room_version"
//    annotationProcessor "androidx.room:room-compiler:$room_version"
}
