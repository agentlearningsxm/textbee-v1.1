name: Upstream watch

on:
  schedule:
    - cron: '0 8 * * 1' # every Monday 08:00 UTC
  workflow_dispatch: {}

permissions:
  issues: write
  contents: read

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare with upstream
        id: compare
        run: |
          git remote add upstream https://github.com/vernu/textbee.git
          git fetch upstream main --quiet
          BEHIND=$(git rev-list --count HEAD..upstream/main)
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"
          {
            echo "commits<<EOF"
            git log --oneline HEAD..upstream/main | head -30
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Open issue if behind
        if: steps.compare.outputs.behind != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const behind = '${{ steps.compare.outputs.behind }}';
            const commits = `${{ steps.compare.outputs.commits }}`;
            const title = `Upstream sync available: ${behind} new commit(s) from vernu/textbee`;
            // skip if an open upstream-sync issue already exists
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'upstream-sync',
            });
            if (existing.data.length > 0) {
              const issue = existing.data[0];
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                title,
                body: `Upstream \`vernu/textbee\` is **${behind} commit(s)** ahead of this fork.\n\nNew commits:\n\`\`\`\n${commits}\n\`\`\`\n\nTo sync: open the repo in Claude Code and run the \`textbee-upstream-sync\` skill.`,
              });
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ['upstream-sync'],
              body: `Upstream \`vernu/textbee\` is **${behind} commit(s)** ahead of this fork.\n\nNew commits:\n\`\`\`\n${commits}\n\`\`\`\n\nTo sync: open the repo in Claude Code and run the \`textbee-upstream-sync\` skill.`,
            });
